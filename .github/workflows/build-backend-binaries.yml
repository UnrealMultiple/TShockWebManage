name: Build Backend Binaries

on:
  push:
    branches: ["master"]
    paths:
      - "Server/**"
      - ".github/workflows/build-backend-binaries.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            bin: terraria-backend.exe
            release_bin: terraria-backend-win-x64.exe
          - os: ubuntu-latest
            rid: linux-x64
            bin: terraria-backend
            release_bin: terraria-backend-linux-x64

    defaults:
      run:
        working-directory: Server
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build backend executable
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onefile \
            --name terraria-backend \
            --distpath artifacts/${{ matrix.rid }} \
            --workpath build/${{ matrix.rid }} \
            --specpath build/${{ matrix.rid }} \
            --collect-all fastapi \
            --collect-all starlette \
            --collect-all pydantic \
            --collect-all uvicorn \
            run_backend.py

      - name: Verify output
        run: |
          test -f artifacts/${{ matrix.rid }}/${{ matrix.bin }}

      - name: Prepare release file
        run: |
          cp artifacts/${{ matrix.rid }}/${{ matrix.bin }} artifacts/${{ matrix.rid }}/${{ matrix.release_bin }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraria-backend-${{ matrix.rid }}
          path: Server/artifacts/${{ matrix.rid }}/${{ matrix.release_bin }}
          if-no-files-found: error

  release:
    name: Publish backend release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: terraria-backend-*
          path: release-artifacts
          merge-multiple: true

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: backend-latest
          name: "Backend Binary (latest)"
          body: |
            ## 后端

            Python 后端打包的独立可执行文件，无需安装 Python 环境，下载对应平台的文件直接运行即可启动后端服务。

            | 文件名 | 平台 |
            |---|---|
            | `terraria-backend-win-x64.exe` | Windows x64 |
            | `terraria-backend-linux-x64` | Linux x64 |

            > 由 master 分支自动构建，Commit: ${{ github.sha }}
          prerelease: false
          files: release-artifacts/*
