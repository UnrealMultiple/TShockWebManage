name: Build Backend Binaries

on:
  push:
    branches: ["master"]
    paths:
      - "Server/**"
      - ".github/workflows/build-backend-binaries.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build win-x64
    runs-on: windows-latest

    defaults:
      run:
        working-directory: Server
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build backend executable
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onefile \
            --name terraria-backend \
            --distpath artifacts/win-x64 \
            --workpath build/win-x64 \
            --specpath build/win-x64 \
            --collect-all fastapi \
            --collect-all starlette \
            --collect-all pydantic \
            --collect-all uvicorn \
            run_backend.py

      - name: Verify output
        run: |
          test -f artifacts/win-x64/terraria-backend.exe

      - name: Upload exe artifact only
        uses: actions/upload-artifact@v4
        with:
          name: terraria-backend-win-x64-exe
          path: Server/artifacts/win-x64/terraria-backend.exe
          if-no-files-found: error
