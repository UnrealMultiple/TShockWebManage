name: Sync TShock Schema

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-schema:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run sync script
        run: python Server/tools/sync_tshock_schema.py

      - name: Commit and push changes
        shell: bash
        run: |
          if git diff --quiet -- Web/src/config/tshock_schema.js; then
            echo "No schema changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Web/src/config/tshock_schema.js
          git commit -m "chore(schema): sync tshock wiki descriptions [skip ci]"
          git push
