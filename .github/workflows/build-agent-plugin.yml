name: Build TShock Agent Plugin

on:
  push:
    branches: ["master"]
    paths:
      - "Agent/**"
      - ".github/workflows/build-agent-plugin.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore Agent/TerrariaAgent.csproj

      - name: Build Release
        run: dotnet build Agent/TerrariaAgent.csproj -c Release --no-restore -o artifacts/AgentPlugin/ServerPlugins

      - name: Collect plugin dll only
        shell: pwsh
        run: |
          $dll = "artifacts/AgentPlugin/ServerPlugins/TerrariaAgent.dll"
          if (!(Test-Path $dll)) {
            throw "Plugin dll not found: $dll"
          }
          New-Item -ItemType Directory -Force -Path artifacts/AgentPluginRelease | Out-Null
          Copy-Item $dll "artifacts/AgentPluginRelease/TerrariaAgent.dll" -Force

      - name: Upload dll artifact only
        uses: actions/upload-artifact@v4
        with:
          name: TerrariaAgent-Plugin-dll
          path: artifacts/AgentPluginRelease/TerrariaAgent.dll
          if-no-files-found: error

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-latest
          name: "TShock Agent Plugin (latest)"
          body: |
            Auto-release from master branch.
            Commit: ${{ github.sha }}
          prerelease: false
          make_latest: false
          files: artifacts/AgentPluginRelease/TerrariaAgent.dll