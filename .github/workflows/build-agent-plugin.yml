name: Build Terraria Manager Agent Plugin

on:
  push:
    branches: ["master"]
    paths:
      - "Agent/**"
      - ".github/workflows/build-agent-plugin.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore Agent/TerrariaManagerAgent.csproj

      - name: Build Release
        run: dotnet build Agent/TerrariaManagerAgent.csproj -c Release --no-restore -o artifacts/AgentPlugin/ServerPlugins

      - name: Collect plugin dll only
        shell: pwsh
        run: |
          $dll = "artifacts/AgentPlugin/ServerPlugins/TerrariaManagerAgent.dll"
          if (!(Test-Path $dll)) {
            throw "Plugin dll not found: $dll"
          }
          New-Item -ItemType Directory -Force -Path artifacts/AgentPluginRelease | Out-Null
          Copy-Item $dll "artifacts/AgentPluginRelease/TerrariaManagerAgent.dll" -Force

      - name: Upload dll artifact only
        uses: actions/upload-artifact@v4
        with:
          name: TerrariaManagerAgent-Plugin-dll
          path: artifacts/AgentPluginRelease/TerrariaManagerAgent.dll
          if-no-files-found: error

      - name: Remove legacy release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view agent-latest --repo $env:GITHUB_REPOSITORY 1>$null 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release agent-latest does not exist yet."
            exit 0
          }
          gh release delete-asset agent-latest TerrariaAgent.dll --yes --repo $env:GITHUB_REPOSITORY 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Removed legacy asset TerrariaAgent.dll."
            exit 0
          }
          Write-Host "Legacy asset TerrariaAgent.dll was not present."
          exit 0

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-latest
          name: "Terraria Manager Agent Plugin (latest)"
          body: |
            适用于 TShock 服务端的 Agent 插件，将 `TerrariaManagerAgent.dll` 放入服务端 `ServerPlugins/` 目录后重启即可加载。
          prerelease: false
          make_latest: false
          files: artifacts/AgentPluginRelease/TerrariaManagerAgent.dll
